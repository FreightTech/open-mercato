name: CI for Develop&Main
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install markitdown CLI
        run: python3 -m pip install --upgrade pip markitdown

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build:packages

      - name: Prepare generated modules
        run: yarn generate

      - name: Rebuild packages with generated files
        run: yarn build:packages

      - name: Checking types
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build:app

  e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build:packages

      - name: Prepare generated modules
        run: yarn generate

      - name: Rebuild packages with generated files
        run: yarn build:packages

      - name: Build app
        run: yarn build:app

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/mercato

      - name: Initialize test database
        run: yarn initialize
        env:
          DATABASE_URL: file:./test.db

      - name: Run E2E tests
        run: yarn e2e
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/mercato/e2e-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    # Only run on non-fork PRs (forks don't have access to GHA cache)
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docs Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build fullapp (main app)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build opencode container
        uses: docker/build-push-action@v6
        with:
          context: ./docker/opencode
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
