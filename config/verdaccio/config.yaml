storage: /verdaccio/storage
plugins: /verdaccio/plugins

web:
  title: Open Mercato Local Registry
  sort_packages: asc

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    # Set to -1 to disable self-registration. Create users manually:
    #   htpasswd -b /verdaccio/storage/htpasswd <username> <password>
    # Or temporarily set to 1, register, then set back to -1.
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true

packages:
  '@open-mercato/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    # No proxy - these are local packages only

  'create-mercato-app':
    access: $all
    publish: $authenticated
    unpublish: $authenticated

  '@*/*':
    access: $all
    publish: $authenticated
    proxy: npmjs

  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs

server:
  keepAliveTimeout: 60

max_body_size: 50mb

middlewares:
  audit:
    enabled: true

log:
  type: stdout
  format: pretty
  level: info
