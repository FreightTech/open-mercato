schema:
  version: "1.0"
  name: "Freight Invoice"
  documentType: "invoice"

detection:
  patterns:
    - regex: "faktura|invoice|rachunek"
      weight: 50
    - regex: "VAT|NIP|tax.?id|numer.?identyfikacyjny"
      weight: 30
    - regex: "kwota.*brutto|gross.*amount|total|suma"
      weight: 20
    - regex: "netto|net.*amount"
      weight: 15
    - regex: "data.*wystawienia|issue.*date|invoice.*date"
      weight: 15
  requiredPatterns:
    - "faktura|invoice|rachunek"
  minScore: 40

fields:
  invoice_number:
    type: string
    required: true
    description: "Invoice number/identifier"
    patterns:
      - "FV.*"
      - "INV-.*"
      - "FA.*"
      - "\\d{4}/\\d+"

  invoice_date:
    type: date
    required: true
    description: "Date the invoice was issued"

  due_date:
    type: date
    required: false
    description: "Payment due date"

  service_date:
    type: date
    required: false
    description: "Date of service delivery"

  seller:
    type: object
    required: true
    description: "Seller/vendor information"
    properties:
      name:
        type: string
        required: true
        description: "Company name"
      tax_id:
        type: string
        required: false
        description: "Tax identification number (NIP, VAT ID)"
        patterns:
          - "\\d{10}"
          - "[A-Z]{2}\\d+"
      address:
        type: string
        required: false
        description: "Full address"

  buyer:
    type: object
    required: false
    description: "Buyer/customer information"
    properties:
      name:
        type: string
        required: true
        description: "Company name"
      tax_id:
        type: string
        required: false
        description: "Tax identification number"
      address:
        type: string
        required: false
        description: "Full address"

  line_items:
    type: array
    required: true
    description: "Invoice line items/charges"
    itemSchema:
      description:
        type: string
        required: true
        description: "Description of the service/product"
      quantity:
        type: decimal
        required: false
        description: "Quantity"
      unit:
        type: string
        required: false
        description: "Unit of measure"
      unit_price_net:
        type: decimal
        required: false
        description: "Unit price before tax"
      vat_rate:
        type: decimal
        required: false
        description: "VAT/tax rate percentage"
      net_amount:
        type: decimal
        required: false
        description: "Net amount for this line"
      vat_amount:
        type: decimal
        required: false
        description: "VAT/tax amount for this line"
      gross_amount:
        type: decimal
        required: true
        description: "Gross amount including tax"

  totals:
    type: object
    required: true
    description: "Invoice totals"
    properties:
      net_amount:
        type: decimal
        required: false
        description: "Total net amount"
      vat_amount:
        type: decimal
        required: false
        description: "Total VAT amount"
      gross_amount:
        type: decimal
        required: true
        description: "Total gross amount"

  currency:
    type: string
    required: true
    description: "Currency code (ISO 4217)"
    patterns:
      - "PLN|EUR|USD|GBP|CHF"

  payment_terms:
    type: string
    required: false
    description: "Payment terms/conditions"

  bank_account:
    type: string
    required: false
    description: "Bank account for payment"

  transportation:
    type: object
    required: false
    description: "Transportation references if present"
    properties:
      bl_number:
        type: string
        required: false
        description: "Bill of Lading number"
        patterns:
          - "[A-Z]{4}\\d{8,}"
      container_numbers:
        type: array
        required: false
        itemType: string
        description: "Container numbers"
      booking_number:
        type: string
        required: false
        description: "Booking reference"
      vessel_name:
        type: string
        required: false
        description: "Vessel name"
      voyage_number:
        type: string
        required: false
        description: "Voyage number"

normalization:
  rules:
    - path: "line_items.*.net_amount"
      transform: decimal_2dp
    - path: "line_items.*.vat_amount"
      transform: decimal_2dp
    - path: "line_items.*.gross_amount"
      transform: decimal_2dp
    - path: "line_items.*.unit_price_net"
      transform: decimal_2dp
    - path: "line_items.*.quantity"
      transform: decimal_4dp
    - path: "totals.net_amount"
      transform: decimal_2dp
    - path: "totals.vat_amount"
      transform: decimal_2dp
    - path: "totals.gross_amount"
      transform: decimal_2dp
    - path: "invoice_date"
      transform: iso_date
    - path: "due_date"
      transform: iso_date
    - path: "service_date"
      transform: iso_date
    - path: "currency"
      transform: uppercase
    - path: "transportation.bl_number"
      transform: uppercase
    - path: "transportation.container_numbers.*"
      transform: normalize_container
